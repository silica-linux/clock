name: silica_clock
description: The clock app of Silica.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  intl: any
  silica_ui:
    git:
      url: https://github.com/silica-linux/silica-ui.git
      ref: v0.19.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  fonts:
    # Inter as a variable font: the thin digits of the stopwatch and the timer (weight 200),
    # which the static Regular and SemiBold of silica_ui cannot draw.
    - family: InterVariable
      fonts:
        - asset: assets/fonts/InterVariable.ttf
