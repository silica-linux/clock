<line x1="499.5" y1="46" x2="499.5" y2="74" stroke="#c0392b"/>
<text x="499.5" y="86" text-anchor="middle" fill="#c0392b">settled +630</text>
<text x="10" y="144" fill="#333" font-weight="600">Alarm</text>
<rect x="237.55" y="132" width="311.99999999999994" height="16" fill="#d6e4f5"/>
<text x="393.54999999999995" y="144" text-anchor="middle" fill="#2c5a8a">banner slides in</text>
<line x1="90.0" y1="126" x2="90.0" y2="154" stroke="#c0392b"/>
<text x="90.0" y="122" text-anchor="middle" fill="#c0392b">minute</text>
<line x1="98.45" y1="126" x2="98.45" y2="154" stroke="#c0392b"/>
