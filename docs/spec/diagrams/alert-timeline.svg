<line x1="237.55" y1="126" x2="237.55" y2="154" stroke="#c0392b"/>
<text x="237.55" y="166" text-anchor="middle" fill="#c0392b">+227</text>
<line x1="342.85" y1="126" x2="342.85" y2="154" stroke="#c0392b"/>
<text x="342.85" y="122" text-anchor="middle" fill="#c0392b">sound +389</text>
<line x1="549.55" y1="126" x2="549.55" y2="154" stroke="#c0392b"/>
