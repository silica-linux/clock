<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="Helvetica, Arial, sans-serif" font-size="10">
<title>Clock: timer end and alarm firing timelines, milliseconds</title>
