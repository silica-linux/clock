<line x1="90.0" y1="46" x2="90.0" y2="74" stroke="#c0392b"/>
<text x="90.0" y="42" text-anchor="middle" fill="#c0392b">picker reset</text>
<line x1="185.55" y1="46" x2="185.55" y2="74" stroke="#c0392b"/>
<text x="185.55" y="86" text-anchor="middle" fill="#c0392b">+147</text>
<line x1="278.5" y1="46" x2="278.5" y2="74" stroke="#c0392b"/>
