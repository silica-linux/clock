<line x1="545.0" y1="190" x2="545.0" y2="194" stroke="#333"/><text x="545.0" y="206" text-anchor="middle" fill="#333">700</text>
<line x1="610.0" y1="190" x2="610.0" y2="194" stroke="#333"/><text x="610.0" y="206" text-anchor="middle" fill="#333">800</text>
<text x="10" y="64" fill="#333" font-weight="600">Timer end</text>
<rect x="185.55" y="52" width="313.95" height="16" fill="#d6e4f5"/>
